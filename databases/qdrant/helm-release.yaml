apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qdrant
  namespace: qdrant
spec:
  releaseName: qdrant
  interval: 15m
  chart:
    spec:
      chart: qdrant
      sourceRef:
        kind: HelmRepository
        name: qdrant
        namespace: qdrant

  values:
    persistence:
      size: 2Gi
      storageClassName: longhorn
