apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jenkins
  namespace: jenkins
spec:
  releaseName: jenkins
  interval: 10m
  install:
    timeout: 30m # Longer for first-time installs (PV provisioning, migrations, etc.)
  upgrade:
    timeout: 30m # For subsequent upgrades
  chart:
    spec:
      chart: jenkins
      sourceRef:
        kind: HelmRepository
        name: jenkins
        namespace: jenkins
  values:
    controller:
      jenkinsUrl: "https://jenkins.anyman.homelab"
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "1000m"
          memory: "2Gi"
      javaOpts: >
        -Xms512m
        -Xmx1536m
        -Djava.awt.headless=true
      admin:
        username: "admin" # or your preferred username
        existingSecret: "jenkins-admin-password" # Name of your Secret
        passwordKey: "password"

      JCasC:
        defaultConfig: false # You want this disabled
        overwriteConfiguration: false # Important to avoid overrides

      # Optional but recommended - disable chart's default secret creation
      adminSecret: false # Prevents chart from creating its own secret
    persistence:
      enabled: true
      storageClass: "longhorn-no-replicas"
      labels:
        recurring-job.longhorn.io/source: enabled
        recurring-job.longhorn.io/jenkins-backup: enabled
      size: 10Gi
      accessMode: ReadWriteOnce
    serviceAccount:
      create: true
      name: jenkins
    serviceAccountAgent:
      create: true
      name: jenkins-agent
    rbac:
      create: true
    agent:
      enabled: true
      namespace: "jenkins-agents"
      resources:
        requests:
          cpu: "200m"
          memory: "512Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"
      containerCap: 20
      instanceCap: 10
