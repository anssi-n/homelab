apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mkcert-ca-secret
  namespace: jenkins-agents
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mkcert-ca-secret
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: mkcert
        property: ca.crt
