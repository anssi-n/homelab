---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-ca-cert
  namespace: jenkins-agents
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-ca-cert
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: harbor
        #        property: harbor-cert
        property: harbor-ca-cert
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-credentials
  namespace: jenkins-agents
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"https://harbor.anyman.homelab":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: harbor_user/cicd
        property: username
    - secretKey: password
      remoteRef:
        key: harbor_user/cicd
        property: password
