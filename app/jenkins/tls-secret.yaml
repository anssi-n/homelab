apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-tls
  namespace: jenkins
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: jenkins-tls
    deletionPolicy: Delete
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: jenkins
        property: jenkins-cert
    - secretKey: tls.key
      remoteRef:
        key: jenkins
        property: jenkins-key
