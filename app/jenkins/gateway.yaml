apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: jenkins-gateway
  namespace: jenkins
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: jenkins.anyman.homelab
      tls:
        certificateRefs:
          - kind: Secret
            group: ""
            name: jenkins-tls
      allowedRoutes:
        namespaces:
          from: All
