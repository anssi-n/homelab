apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-admin-password
  namespace: jenkins
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: jenkins-admin-password
    deletionPolicy: Delete
  data:
    - secretKey: password
      remoteRef:
        key: jenkins
        property: jenkins-admin-password
