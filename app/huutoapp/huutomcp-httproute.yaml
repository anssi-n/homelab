---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: huutoapp-mcp-backend
  namespace: huutoapp
spec:
  mcp:
    targets:
      - name: huutoapp-mcp-server
        selector:
          services:
            matchLabels:
              app: huutomcp
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: keycloak-jwks
  namespace: huutoapp
spec:
  static:
    host: keycloak.anyman.homelab
    port: 8443
  policies:
    tls:
      sni: keycloak.anyman.homelab
      caCertificateRefs:
        - name: keycloak-ca-cert
          kind: Secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: huutoapp-mcp
  namespace: huutoapp
spec:
  parentRefs:
    - name: ai-gateway
      namespace: infra
      sectionName: https-mcp
  hostnames:
    - huutoapp.mcp.anyman.homelab
  rules:
    - backendRefs:
        - name: huutoapp-mcp-backend
          group: agentgateway.dev
          kind: AgentgatewayBackend
      matches:
        - path:
            type: PathPrefix
            value: /mcp
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource/mcp
        - path:
            type: PathPrefix
            value: /.well-known/oauth-authorization-server/mcp
