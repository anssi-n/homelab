---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: huutoapp-mcp-backend
  namespace: huutoapp
spec:
  mcp:
    targets:
      - name: huutoapp-mcp-server
        selector:
          services:
            matchLabels:
              app: huutomcp
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: huutoapp-mcp
  namespace: huutoapp
spec:
  parentRefs:
    - name: ai-gateway
      namespace: infra
      sectionName: https-mcp
  hostnames:
    - huutoapp.mcp.anyman.homelab
  rules:
    - backendRefs:
        - name: huutoapp-mcp-backend
          group: agentgateway.dev
          kind: AgentgatewayBackend
      matches:
        - path:
            type: PathPrefix
            value: /mcp
