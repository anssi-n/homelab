apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: huutoapp-gateway
  namespace: huutoapp
spec:
  gatewayClassName: envoy
  listeners:
    - name: huutoapp-db
      protocol: TCP
      port: 5432
      allowedRoutes:
        namespaces:
          from: All
    - name: redis
      protocol: TCP
      port: 6379
      allowedRoutes:
        namespaces:
          from: All
