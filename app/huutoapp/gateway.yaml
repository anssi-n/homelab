apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: huutoapp-gateway
  namespace: huutoapp
spec:
  gatewayClassName: envoy
  listeners:
    - name: huutoapp-db
      protocol: TCP
      port: 5432
      allowedRoutes:
        namespaces:
          from: All
    - name: redis
      protocol: TCP
      port: 6379
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: huutoapp.anyman.homelab
      tls:
        certificateRefs:
          - kind: Secret
            group: ""
            name: huutoapp-cert
      allowedRoutes:
        namespaces:
          from: All
