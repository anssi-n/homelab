  ingress:
    # Traffic from gateway api
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: envoy-gateway
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP

    # Traffic from huutoapi
    - fromEndpoints:
        - matchLabels:
            app: huutoapi
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP

    # Traffic from huutoworker
    - fromEndpoints:
        - matchLabels:
            app: huutoworker
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
