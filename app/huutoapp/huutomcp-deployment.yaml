apiVersion: v1
kind: ServiceAccount
metadata:
  name: huutomcp-sa
  namespace: huutoapp
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: huutomcp
  name: huutomcp
  namespace: huutoapp
spec:
  selector:
    matchLabels:
      app: huutomcp
  template:
    metadata:
      labels:
        app: huutomcp
    spec:
      hostUsers: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: huutomcp
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: huutomcp
      securityContext:
        seccompProfile:
          type: "RuntimeDefault"
        fsGroup: 101
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: huutomcp-sa
      containers:
        - image: harbor.anyman.homelab/huutoapp/huutomcp:0.4.11@sha256:0fb6d32dbb529fe5437bec4814e2cfa9aa68b2c7a05744d4dba3cc1ab1a90720 # {"$imagepolicy": "flux-system:huutomcp"}
          name: huutomcp
          imagePullPolicy: Always
          resources:
            requests:
              memory: "200Mi"
              cpu: "200m"
            limits:
              memory: "1500Mi"
              cpu: "1000m"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: huutomcp-config-v1.0
            - secretRef:
                name: huutoapp-secrets
          env:
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/keycloak-ca-cert.crt
            - name: TOOL_DOCS_PATH
              value: /config/tool-docs.yaml
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: huutoapp-secrets
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: keycloak-ca
              mountPath: /etc/ssl/certs/keycloak-ca-cert.crt
              subPath: ca.crt
              readOnly: true
            - name: tool-docs
              mountPath: /config
              readOnly: true
            - name: db-creds
              mountPath: /etc/secrets/db
              readOnly: true
          ports:
            - name: liveness-port
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: liveness-port
            failureThreshold: 1
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: liveness-port
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: liveness-port
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: keycloak-ca
          secret:
            secretName: keycloak-ca-cert
        - name: tool-docs
          configMap:
            name: huutoapp-mcp-tool-docs-v1.0
        - name: db-creds
          secret:
            secretName: huutoapp-dynamic-creds
