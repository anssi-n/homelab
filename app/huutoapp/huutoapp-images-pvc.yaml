apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: huutoapi-images
  namespace: huutoapp
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  volumeMode: Filesystem
  resources:
    requests:
      storage: 2Gi
