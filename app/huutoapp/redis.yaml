apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: redis
  namespace: huutoapp
spec:
  kubernetesConfig:
    image: quay.io/opstree/redis:v8.4.2
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: redis-secret
      key: password
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.81.0
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Mi
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
