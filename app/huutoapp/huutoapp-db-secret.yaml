apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: huutoapp-db-credentials
  namespace: huutoapp
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: huutoapp-db-secret
    deletionPolicy: Delete
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: huutoapp-db
        property: username
    - secretKey: password
      remoteRef:
        key: huutoapp-db
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-secret
  namespace: huutoapp
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: redis-secret
    deletionPolicy: Delete
  data:
    - secretKey: password
      remoteRef:
        key: redis
        property: password
