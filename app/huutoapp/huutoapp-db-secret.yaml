apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: huutoapp-db-credentials
  namespace: huutoapp
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: huutoapp-db-secret
    deletionPolicy: Delete
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: huutoapp-db
        property: username
    - secretKey: password
      remoteRef:
        key: huutoapp-db
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-secret
  namespace: huutoapp
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: redis-secret
    deletionPolicy: Delete
  data:
    - secretKey: password
      remoteRef:
        key: redis
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: huutoapp-secrets
  namespace: huutoapp
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: huutoapp-secrets
    deletionPolicy: Delete
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: huutoapp
        property: huutoapp-cert
        version: "1"
    - secretKey: tls.key
      remoteRef:
        key: huutoapp
        property: huutoapp-key
        version: "1"
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: huutoapp
        property: database-password
        version: "2"
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: huutoapp
        property: redis-password
        version: "2"
    - secretKey: HUUTO_PASSWORD
      remoteRef:
        key: huutoapp
        property: huuto-password
        version: "2"
    - secretKey: OMDB_API_KEY
      remoteRef:
        key: huutoapp
        property: omdb-api-key
        version: "2"
    - secretKey: SECRET_KEY
      remoteRef:
        key: huutoapp
        property: secret_key
        version: "3"
