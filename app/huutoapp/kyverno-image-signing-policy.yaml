---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cosign-public-key
  namespace: huutoapp
data:
  cosign.pub: |
    -----BEGIN PUBLIC KEY-----
    MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEmvCysousaUreg2wJcWJOdzNzGsoq
    1aBa3lGda2WBPgkDQXXBXfcGiWAdK1pFBKqRxhZYqpXfQaTQDExTb1aRPg==
    -----END PUBLIC KEY-----
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedImageValidatingPolicy
metadata:
  name: verify-signed-huutoapp-images
  namespace: huutoapp
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: true
  matchConditions:
    - name: skip-inactive-owners
      expression: >-
        !has(object.status.replicas) || object.status.replicas > 0
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "harbor.anyman.homelab/huutoapp/*"

  variables:
    - name: cosignKey
      expression: >-
        resource.Get("v1", "configmaps", "cosign-public-key").data["cosign.pub"]

  attestors:
    - name: cosign
      cosign:
        key:
          expression: variables.cosignKey

  attestations:
    # SBOM attestation
    - name: sbom
      intoto:
        type: https://cyclonedx.org/bom

    # Trivy vulnerability scan attestation
    - name: vuln
      intoto:
        type: https://cosign.sigstore.dev/attestation/vuln/v1

  validations:
    # 1. Image must be signed
    - expression: >-
        images.containers.map(image,
          verifyImageSignatures(image, [attestors.cosign])
        ).all(e, e > 0)
      message: "All HuutoApp images must be signed!"

    # 2. SBOM attestation must exist and be signed
    - expression: >-
        images.containers.map(image,
          verifyAttestationSignatures(image, attestations.sbom, [attestors.cosign])
        ).all(e, e > 0)
      message: "All HuutoApp images must have a signed SBOM attestation"

    # 4. Vulnerability scan attestation must exist and be signed
    - expression: >-
        images.containers.map(image,
          verifyAttestationSignatures(image, attestations.vuln, [attestors.cosign])
        ).all(e, e > 0)
      message: "All HuutoApp images must have a signed Trivy vulnerability scan attestation"

    # 5. Scan must be recent (example: ≤ 7 days / 168 hours)
    - expression: >-
        images.containers.map(image,
          extractPayload(image, attestations.vuln).predicate.metadata.scanFinishedOn
        ).all(t,
          t != null &&
          time.now() - timestamp(string(t)) < duration("168h")
        )
      message: "Vulnerability scan must be no older than 7 days"
