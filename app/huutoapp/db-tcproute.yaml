apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: huutoapp-db
  namespace: huutoapp
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: infra
      sectionName: huutoapp-db
  rules:
    - backendRefs:
        - name: huutoapp-db-rw
          port: 5432
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: redis
  namespace: huutoapp
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: infra
      sectionName: huutoapp-redis
  rules:
    - backendRefs:
        - name: redis
          port: 6379
