apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: huutoapp
  namespace: huutoapp
spec:
  parentRefs:
    - name: huutoapp-gateway
      sectionName: https
      kind: Gateway

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: huutoapi
          port: 8000
          weight: 1
