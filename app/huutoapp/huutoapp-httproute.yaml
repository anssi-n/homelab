apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: huutoapp
  namespace: huutoapp
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: infra
      sectionName: huutoapp-https
      kind: Gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: huutoapi
          port: 8000
          weight: 1
