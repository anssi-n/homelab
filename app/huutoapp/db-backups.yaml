---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: huutoapp-db-backup-aws
  namespace: huutoapp
spec:
  path: "aws/creds/db-backup-role"
  method: GET
  provider:
    server: https://vault.anyman.homelab:8200
    auth:
      kubernetes:
        mountPath: homelab-k8s
        role: external-secrets
    caBundle: 
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: huutoapp-db-backup-credentials
  namespace: huutoapp
spec:
  refreshInterval: 60m
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: huutoapp-db-backup-aws

  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  target:
    name: huutoapp-db-backup-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_key }}"
        AWS_SESSION_TOKEN: "{{ .security_token }}"
        AWS_DEFAULT_REGION: "{{ .aws_region }}"

  data:
    - secretKey: aws_region
      remoteRef:
        key: etcd-backup
        property: AWS_REGION
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: huutoapp-db-s3
  namespace: huutoapp
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: "s3://homelab-db-backup-f334d2a80cb9c603/cnpg/huutoapp-db"
    s3Credentials:
      accessKeyId:
        name: huutoapp-db-backup-credentials
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: huutoapp-db-backup-credentials
        key: AWS_SECRET_ACCESS_KEY
      sessionToken:
        name: huutoapp-db-backup-credentials
        key: AWS_SESSION_TOKEN
      region:
        name: huutoapp-db-backup-credentials
        key: AWS_DEFAULT_REGION
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
      jobs: 2
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: huutoapp-db-daily
  namespace: huutoapp
spec:
  schedule: "0 0 16 * * *"
  cluster:
    name: huutoapp-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  immediate: true
  target: prefer-standby
  backupOwnerReference: self
  suspend: false
