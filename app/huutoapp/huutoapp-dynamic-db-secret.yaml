---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: huutoapp-dynamic-creds
  namespace: huutoapp
spec:
  path: "database/creds/huutoapp-db-role"
  method: "GET"
  provider:
    server: https://vault.anyman.homelab:8200
    auth:
      kubernetes:
        mountPath: homelab-k8s
        role: external-secrets
    caBundle: 
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: huutoapp-dynamic-creds
  namespace: huutoapp
spec:
  refreshInterval: "50m"
  target:
    name: huutoapp-dynamic-creds
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: huutoapp-dynamic-creds
