# yaml-language-server: $schema=none
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: huutoapp-db
  namespace: huutoapp
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  plugins:
    - enabled: true
      isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: huutoapp-db-s3
  storage:
    storageClass: local-path
    size: 50Mi
  walStorage:
    storageClass: local-path
    size: 5Mi
  managed:
    roles:
      - name: huutoapp
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: huutoapp-db-secret
      - name: vaultuser
        ensure: present
        login: true
        superuser: true
        passwordSecret:
          name: vaultuser-db-secret
