apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: huutoapp-db
  namespace: huutoapp
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  storage:
    storageClass: local-path
    size: 50Mi
  walStorage:
    storageClass: local-path
    size: 5Mi
  managed:
    roles:
      - name: huutoapp
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: huutoapp-db-secret
