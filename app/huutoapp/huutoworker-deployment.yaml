apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: huutoworker
  name: huutoworker
  namespace: huutoapp
spec:
  selector:
    matchLabels:
      app: huutoworker
  template:
    metadata:
      labels:
        app: huutoworker
    spec:
      securityContext:
        fsGroup: 101
      automountServiceAccountToken: false
      volumes:
        - name: images-volume
          persistentVolumeClaim:
            claimName: huutoapi-images
      containers:
        - image: harbor.anyman.homelab/huutoapp/huutoworker:0.1.1
          name: huutoworker
          resources:
            requests:
              memory: "150Mi"
              cpu: "50m"
            limits:
              memory: "250Mi"
              cpu: "150m"
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: huutoapp-secrets
            - configMapRef:
                name: huutoapp-config
          volumeMounts:
            - mountPath: /app/media/images
              name: images-volume
