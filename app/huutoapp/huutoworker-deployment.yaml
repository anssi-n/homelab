apiVersion: v1
kind: ServiceAccount
metadata:
  name: huutoworker-sa
  namespace: huutoapp
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: huutoworker
  name: huutoworker
  namespace: huutoapp
spec:
  selector:
    matchLabels:
      app: huutoworker
  template:
    metadata:
      labels:
        app: huutoworker
    spec:
      securityContext:
        fsGroup: 101
      serviceAccountName: huutoworker-sa
      volumes:
        - name: images-volume
          persistentVolumeClaim:
            claimName: huutoapi-images
      containers:
        - image: harbor.anyman.homelab/huutoapp/huutoworker@sha256:d43b7edeb362d7f616de67abb0c9224105b2a5c42e78593e6abc1371c5958ad7 # 0.1.9
          name: huutoworker
          imagePullPolicy: Always
          resources:
            requests:
              memory: "150Mi"
              cpu: "50m"
            limits:
              memory: "250Mi"
              cpu: "150m"
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: huutoapp-secrets
            - configMapRef:
                name: huutoapp-config
          volumeMounts:
            - mountPath: /app/media/images
              name: images-volume
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: huutoworker
  name: huutoworker
  namespace: huutoapp
spec:
  ports:
    - port: 8080
      name: metrics
      protocol: TCP
      targetPort: 8080
  selector:
    app: huutoworker
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: kube-prometheus-stack
  name: huutoworker-servicemonitor
  namespace: huutoapp
spec:
  endpoints:
    - interval: 5s
      path: /metrics/
      port: metrics
  namespaceSelector:
    matchNames:
      - huutoapp
  selector:
    matchLabels:
      app: huutoworker
