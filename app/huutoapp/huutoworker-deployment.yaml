apiVersion: v1
kind: ServiceAccount
metadata:
  name: huutoworker-sa
  namespace: huutoapp
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: huutoworker
  name: huutoworker
  namespace: huutoapp
spec:
  selector:
    matchLabels:
      app: huutoworker
  template:
    metadata:
      labels:
        app: huutoworker
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: huutoworker
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: huutoworker
      securityContext:
        seccompProfile:
          type: "RuntimeDefault"
        fsGroup: 101
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: huutoworker-sa
      volumes:
        - name: images-volume
          persistentVolumeClaim:
            claimName: huutoapi-images
      containers:
        - image: harbor.anyman.homelab/huutoapp/huutoworker@sha256:87e346c16607d99b2ae686b6b82a08e721166c40694e0c35b341c15761a467ae # 0.1.10
          name: huutoworker
          imagePullPolicy: Always
          resources:
            requests:
              memory: "150Mi"
              cpu: "50m"
            limits:
              memory: "250Mi"
              cpu: "150m"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: huutoapp-secrets
            - configMapRef:
                name: huutoapp-config
          volumeMounts:
            - mountPath: /app/media/images
              name: images-volume
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: huutoworker
  name: huutoworker
  namespace: huutoapp
spec:
  ports:
    - port: 8080
      name: metrics
      protocol: TCP
      targetPort: 8080
  selector:
    app: huutoworker
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: kube-prometheus-stack
  name: huutoworker-servicemonitor
  namespace: huutoapp
spec:
  endpoints:
    - interval: 5s
      path: /metrics/
      port: metrics
  namespaceSelector:
    matchNames:
      - huutoapp
  selector:
    matchLabels:
      app: huutoworker
