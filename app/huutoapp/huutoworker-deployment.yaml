apiVersion: v1
kind: ServiceAccount
metadata:
  name: huutoworker-sa
  namespace: huutoapp
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: huutoworker
  name: huutoworker
  namespace: huutoapp
spec:
  selector:
    matchLabels:
      app: huutoworker
  template:
    metadata:
      labels:
        app: huutoworker
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: huutoworker
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: huutoworker
      securityContext:
        seccompProfile:
          type: "RuntimeDefault"
        fsGroup: 101
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: huutoworker-sa
      volumes:
        - name: images-volume
          persistentVolumeClaim:
            claimName: huutoapi-images
        - name: db-creds
          secret:
            secretName: huutoapp-dynamic-creds
      containers: # Image versions is updated by flux
        - image: harbor.anyman.homelab/huutoapp/huutoworker:0.3.14@sha256:34742522d3f4e5b863985182cc5973c9379d25b65b6bd9b800d7aef0b953cfcb # {"$imagepolicy": "flux-system:huutoworker"}
          name: huutoworker
          imagePullPolicy: Always
          resources:
            requests:
              memory: "150Mi"
              cpu: "50m"
            limits:
              memory: "250Mi"
              cpu: "150m"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: huutoapp-secrets
            - configMapRef:
                name: huutoapp-config-v1.1
          volumeMounts:
            - mountPath: /app/media/images
              name: images-volume
            - name: db-creds
              mountPath: /etc/secrets/db
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: huutoworker
  name: huutoworker
  namespace: huutoapp
spec:
  ports:
    - port: 8080
      name: metrics
      protocol: TCP
      targetPort: 8080
  selector:
    app: huutoworker
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: kube-prometheus-stack
  name: huutoworker-servicemonitor
  namespace: huutoapp
spec:
  endpoints:
    - interval: 5s
      path: /metrics/
      port: metrics
  namespaceSelector:
    matchNames:
      - huutoapp
  selector:
    matchLabels:
      app: huutoworker
