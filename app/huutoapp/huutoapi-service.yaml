---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: huutoapi
  name: huutoapi
  namespace: huutoapp
spec:
  ports:
    - port: 8000
      name: huutoapi
      protocol: TCP
      targetPort: 8000
  selector:
    app: huutoapi
---
# yaml-language-server: $schema=none
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: kube-prometheus-stack
  name: huutoapi-servicemonitor
  namespace: huutoapp
spec:
  endpoints:
    - interval: 10s
      path: /metrics/
      port: huutoapi
  namespaceSelector:
    matchNames:
      - huutoapp
  selector:
    matchLabels:
      app: huutoapi
