apiVersion: v1
kind: ServiceAccount
metadata:
  name: huutoapi-sa
  namespace: huutoapp
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: huutoapi
  name: huutoapi
  namespace: huutoapp
spec:
  selector:
    matchLabels:
      app: huutoapi
  template:
    metadata:
      labels:
        app: huutoapi
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: huutoapi
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: huutoapi
      securityContext:
        seccompProfile:
          type: "RuntimeDefault"
        fsGroup: 101
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: huutoapi-sa
      volumes:
        - name: images-volume
          persistentVolumeClaim:
            claimName: huutoapi-images
        - name: tmp-volume
          emptyDir:
            sizeLimit: 500Mi
            volumes:
        - name: db-creds
          secret:
            secretName: huutoapp-dynamic-creds
      containers: # Image versions is updated by flux
        - image: harbor.anyman.homelab/huutoapp/huutoapi:0.2.5@sha256:87ccdc72869b5286020f5f4816fbef375c78311328c953716b2f43171a8a5840 # {"$imagepolicy": "flux-system:huutoapi"}
          name: huutoapi
          imagePullPolicy: Always
          resources:
            requests:
              memory: "200Mi"
              cpu: "200m"
            limits:
              memory: "1500Mi"
              cpu: "1000m"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: huutoapp-secrets
            - configMapRef:
                name: huutoapp-config
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: images-volume
              mountPath: /app/media/images
            - name: db-creds
              mountPath: /etc/secrets/db
              readOnly: true
          ports:
            - name: liveness-port
              containerPort: 8000

          livenessProbe:
            httpGet:
              path: /health
              port: liveness-port
            failureThreshold: 1
            periodSeconds: 10

          startupProbe:
            httpGet:
              path: /health
              port: liveness-port
            failureThreshold: 30
            periodSeconds: 10
