apiVersion: v1
kind: ServiceAccount
metadata:
  name: huutoapi-sa
  namespace: huutoapp
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: huutoapi
  name: huutoapi
  namespace: huutoapp
spec:
  selector:
    matchLabels:
      app: huutoapi
  template:
    metadata:
      labels:
        app: huutoapi
    spec:
      securityContext:
        fsGroup: 101
      serviceAccountName: huutoapi-sa
      volumes:
        - name: images-volume
          persistentVolumeClaim:
            claimName: huutoapi-images
      containers:
        - image: harbor.anyman.homelab/huutoapp/huutoapi@sha256:d222b1264860fbacd1361d97cabe8ead9895299533f81c56294691cfd2e528c2 # 0.1.7
          name: huutoapi
          imagePullPolicy: Always
          resources:
            requests:
              memory: "200Mi"
              cpu: "200m"
            limits:
              memory: "1500Mi"
              cpu: "1000m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: huutoapp-secrets
            - configMapRef:
                name: huutoapp-config
          volumeMounts:
            - mountPath: /app/media/images
              name: images-volume

          ports:
            - name: liveness-port
              containerPort: 8000

          livenessProbe:
            httpGet:
              path: /health
              port: liveness-port
            failureThreshold: 1
            periodSeconds: 10

          startupProbe:
            httpGet:
              path: /health
              port: liveness-port
            failureThreshold: 30
            periodSeconds: 10
