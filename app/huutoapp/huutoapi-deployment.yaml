apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: huutoapi
  name: huutoapi
  namespace: huutoapp
spec:
  selector:
    matchLabels:
      app: huutoapi
  template:
    metadata:
      labels:
        app: huutoapi
    spec:
      securityContext:
        fsGroup: 101
      automountServiceAccountToken: false
      volumes:
        - name: images-volume
          persistentVolumeClaim:
            claimName: huutoapi-images
      containers:
        - image: harbor.anyman.homelab/huutoapp/huutoapi:0.1.0
          name: huutoapi
          resources:
            requests:
              memory: "200Mi"
              cpu: "200m"
            limits:
              memory: "500Mi"
              cpu: "300m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: huutoapp-secrets
            - configMapRef:
                name: huutoapp-config
          volumeMounts:
            - mountPath: /app/media/images
              name: images-volume

          ports:
            - name: liveness-port
              containerPort: 8000

          livenessProbe:
            httpGet:
              path: /health
              port: liveness-port
            failureThreshold: 1
            periodSeconds: 10

          startupProbe:
            httpGet:
              path: /health
              port: liveness-port
            failureThreshold: 30
            periodSeconds: 10
