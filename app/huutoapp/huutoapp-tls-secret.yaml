apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: huutoapp-tls
  namespace: huutoapp
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: huutoapp-cert
    deletionPolicy: Delete
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: huutoapp
        property: huutoapp-cert
    - secretKey: tls.key
      remoteRef:
        key: huutoapp
        property: huutoapp-key
