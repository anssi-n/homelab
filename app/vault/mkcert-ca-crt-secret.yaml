apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mkcert-ca-secret
  namespace: vault
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mkcert-ca-secret
    deletionPolicy: Delete
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: ca.crt
      remoteRef:
        key: mkcert
        property: ca.crt
