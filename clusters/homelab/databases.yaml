apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: databases
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  path: ./databases/
  dependsOn:
    - name: infra
    - name: config
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
