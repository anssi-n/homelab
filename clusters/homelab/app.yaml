apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
  namespace: flux-system
spec:
  interval: 60s
  path: ./app/
  prune: true
  wait: true
  dependsOn:
    - name: infra
    - name: config
    - name: databases
  sourceRef:
    kind: GitRepository
    name: flux-system
