apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  releaseName: keda
  interval: 10m
  install:
    timeout: 30m # Longer for first-time installs (PV provisioning, migrations, etc.)
  upgrade:
    timeout: 30m # For subsequent upgrades
  chart:
    spec:
      chart: keda
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: keda
  values:
    clusterName: homelab
