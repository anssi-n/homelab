apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  releaseName: harbor
  interval: 10m
  install:
    timeout: 40m # Longer for first-time installs (PV provisioning, migrations, etc.)
  upgrade:
    timeout: 40m # For subsequent upgrades
  chart:
    spec:
      chart: harbor
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: harbor
  valuesFrom:
    - kind: ConfigMap
      name: harbor-values
      valuesKey: harbor-values.yaml
