expose:
  type: clusterIP
  tls:
    certSource: secret
    secret:
      secretName: "harbor-tls"
externalURL: https://harbor.anyman.homelab
persistence:
  enabled: true
  resourcePolicy: "keep"
  persistentVolumeClaim:
    registry:
      storageClass: "longhorn"
      size: 20Gi
    jobservice:
      jobLog:
        storageClass: "longhorn"
        size: 500Mi
    database:
      storageClass: "longhorn"
      size: 2Gi
    redis:
      storageClass: "longhorn"
      size: 200Mi
    trivy:
      storageClass: "longhorn"
      size: 5Gi
ipFamily:
  ipv6:
    enabled: false
caSecretName: "harbor-ca-cert"
existingSecretSecretKey: "harbor-encryption-key"
