---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-ca-cert
  namespace: harbor
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-ca-cert
    deletionPolicy: Delete
  data:
    - secretKey: ca.crt
      remoteRef:
        key: harbor
        property: harbor-ca-cert
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-encryption-key
  namespace: harbor
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-encryption-key
    deletionPolicy: Delete
  data:
    - secretKey: secretKey
      remoteRef:
        key: harbor
        property: harbor-encryption-key
