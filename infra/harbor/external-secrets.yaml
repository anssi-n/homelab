---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-ca-cert
  namespace: harbor
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-ca-cert
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: harbor
        property: harbor-ca-cert
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-encryption-key
  namespace: harbor
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-encryption-key
    deletionPolicy: Retain
  data:
    - secretKey: secretKey
      remoteRef:
        key: harbor
        property: harbor-encryption-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-tls
  namespace: harbor
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-tls
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: harbor
        property: harbor-cert
    - secretKey: tls.key
      remoteRef:
        key: harbor
        property: harbor-key
