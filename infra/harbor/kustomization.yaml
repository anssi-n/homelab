apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harbor
resources:
  - namespace.yaml
  - external-secrets.yaml
  - helm-repository.yaml
  - helm-release.yaml
  #  - gateway.yaml
  - httproute.yaml

configMapGenerator:
  - name: harbor-values
    options:
      disableNameSuffixHash: true
    files:
      - harbor-values.yaml
