apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: traefik-ingress
resources:
  - helm-repository.yaml
  - helm-release.yaml
  - namespace.yaml

configMapGenerator:
  - name: traefik-ingress-values
    options:
      disableNameSuffixHash: true
    files:
      - ./traefik-ingress-values.yaml
