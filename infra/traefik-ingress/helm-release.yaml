apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik-ingress
spec:
  releaseName: traefik
  interval: 10m
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik-ingress
  valuesFrom:
    - kind: ConfigMap
      name: traefik-ingress-values
      valuesKey: traefik-ingress-values.yaml
