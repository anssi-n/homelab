kind: Elasticsearch
metadata:
  name: elastic-search
  namespace: efk
spec:
  version: 9.4.3
  nodeSets:
    - name: default
      count: 1 # Optimized to 1 node for testing (production usually uses 3)
      config:
        node.roles: ["master", "data", "ingest"]
        node.store.allow_mmap: false
        xpack.ml.enabled: false
        xpack.security.enabled: true
        xpack.watcher.enabled: false
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests:
                  memory: 1Gi
                  cpu: 200m
                limits:
                  memory: 2Gi
                  cpu: 1000m
              env:
                - name: ES_JAVA_OPTS
                  value: "-Xms512m -Xmx512m"
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
            storageClassName: longhorn-no-replicas
