apiVersion: batch/v1
kind: Job
metadata:
  name: es-policy-initializer
  namespace: efk
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: curl
          image: curlimages/curl:latest
          command: ["/bin/sh", "/scripts/setup.sh"]
          env:
            - name: ES_PWD
              valueFrom:
                secretKeyRef:
                  name: elastic-search-es-elastic-user
                  key: elastic
          volumeMounts:
            - name: script-vol
              mountPath: /scripts
      volumes:
        - name: script-vol
          configMap:
            name: es-init-policies
