apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kibana-tls
  namespace: efk
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kibana-tls
    deletionPolicy: Delete
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: kibana
        property: kibana-cert
    - secretKey: tls.key
      remoteRef:
        key: kibana
        property: kibana-key
