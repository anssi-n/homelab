apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  releaseName: cert-manager
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: cert-manager
    namespace: cert-manager
  valuesFrom:
    - kind: ConfigMap
      name: cert-manager-values
      valuesKey: cert-manager-values.yaml
