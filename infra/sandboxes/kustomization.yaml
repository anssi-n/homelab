apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gvisor-runtimeclass.yaml
  - oci-repository.yaml
  - helm-release.yaml
  - namespace.yaml

configMapGenerator:
  - name: kata-container-values
    namespace: kata-containers
    options:
      disableNameSuffixHash: true
    files:
      - ./kata-container-values.yaml
