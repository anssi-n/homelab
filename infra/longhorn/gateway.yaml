apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: longhorn-gw
  namespace: longhorn-system
spec:
  gatewayClassName: envoy
  listeners:
    - protocol: HTTPS
      name: https
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: longhorn-ui-cert
            namespace: longhorn-system
