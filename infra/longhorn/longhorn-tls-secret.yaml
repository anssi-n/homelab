apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-tls
  namespace: longhorn-system
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: longhorn-ui-cert
    deletionPolicy: Delete
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: longhorn
        property: longhorn-cert
    - secretKey: tls.key
      remoteRef:
        key: longhorn
        property: longhorn-key
