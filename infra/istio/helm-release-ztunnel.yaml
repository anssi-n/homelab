apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ztunnel
  namespace: istio-system
spec:
  #  helm install ztunnel istio/ztunnel -n istio-system --wait
  releaseName: ztunnel
  interval: 15m
  install:
    timeout: 40m # Longer for first-time installs (PV provisioning, migrations, etc.)
  upgrade:
    timeout: 40m # For subsequent upgrades
  chart:
    spec:
      chart: ztunnel
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: istio-system
