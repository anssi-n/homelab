apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  # helm install istio-base istio/base -n istio-system --set defaultRevision=default --create-namespace
  releaseName: istio-base
  interval: 15m
  install:
    timeout: 40m # Longer for first-time installs (PV provisioning, migrations, etc.)
  upgrade:
    timeout: 40m # For subsequent upgrades
  chart:
    spec:
      chart: base
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: istio-system
