apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
  namespace: agentgateway-system
spec:
  releaseName: agentgateway
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: agentgateway
    namespace: agentgateway-system
  values:
    inferenceExtension:
      enabled: true
