apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  releaseName: kyverno
  interval: 10m
  install:
    timeout: 40m # Longer for first-time installs (PV provisioning, migrations, etc.)
  upgrade:
    timeout: 40m # For subsequent upgrades
  chart:
    spec:
      chart: kyverno
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
  valuesFrom:
    - kind: ConfigMap
      name: kyverno-values
      valuesKey: kyverno-values.yaml
