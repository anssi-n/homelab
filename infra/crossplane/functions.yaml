---
apiVersion: pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: upbound-function-patch-and-transform
spec:
  package: xpkg.upbound.io/upbound/function-patch-and-transform:v0.10.9
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: upbound-function-go-templating
spec:
  package: xpkg.upbound.io/upbound/function-go-templating:v0.12.3
  runtimeConfigRef:
    name: mount-templates
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: mount-templates
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              volumeMounts:
                - mountPath: /templates/azure/devvm
                  name: devvm-azure-templates
                  readOnly: true
                - mountPath: /templates/aws/devvm
                  name: devvm-aws-templates
                  readOnly: true
                - mountPath: /templates/aws/k8s
                  name: k8s-aws-templates
                  readOnly: true
          volumes:
            - name: devvm-azure-templates
              configMap:
                name: devvm-azure-go-templates
            - name: devvm-aws-templates
              configMap:
                name: devvm-aws-go-templates
            - name: k8s-aws-templates
              configMap:
                name: k8s-aws-go-templates

---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: crossplane-contrib-function-kcl
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-kcl:v0.12.2
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: crossplane-contrib-function-python
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-python:v0.5.0
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: upbound-function-auto-ready
spec:
  package: xpkg.upbound.io/upbound/function-auto-ready:v0.6.7
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: crossplane-contrib-function-environment-configs
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-environment-configs:v0.7.3
