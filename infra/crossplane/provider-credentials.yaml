---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crossplane-aws-creds
  namespace: crossplane-aws
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: crossplane-aws-creds
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        creds: |
          [default]
          aws_access_key_id = {{ .aws_access_key_id }}
          aws_secret_access_key = {{ .aws_secret_access_key }}
  data:
    - secretKey: aws_access_key_id
      remoteRef:
        key: crossplane/aws
        property: aws_access_key_id
    - secretKey: aws_secret_access_key
      remoteRef:
        key: crossplane/aws
        property: aws_secret_access_key
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: aws-crossplane-access
  namespace: crossplane-aws
spec:
  path: aws/creds/terraform-runner
  provider:
    server: https://vault.anyman.homelab:8200
    auth:
      kubernetes:
        mountPath: homelab-k8s
        role: external-secrets
    caBundle: 
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-crossplane-access
  namespace: crossplane-aws
spec:
  refreshInterval: "1h"
  target:
    name: aws-crossplane-credentials
    template:
      engineVersion: v2
      data:
        credentials: |
          [default]
          aws_access_key_id = {{ .access_key }}
          aws_secret_access_key = {{ .secret_key }}
          aws_session_token = {{ .session_token | default .security_token }}

  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: aws-crossplane-access
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crossplane-azure-creds
  namespace: crossplane-azure
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: crossplane-azure-creds
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        creds: |
          {
            "clientId": "{{ .client_id  }}",
            "clientSecret": "{{ .client_secret }}",
            "subscriptionId": "{{ .subscription_id }}",
            "tenantId": "{{ .tenant_id }}",
            "activeDirectoryEndpointUrl": "https://login.microsoftonline.com",
            "resourceManagerEndpointUrl": "https://management.azure.com/",
            "activeDirectoryGraphResourceId": "https://graph.windows.net/",
            "sqlManagementEndpointUrl": "https://management.core.windows.net:8443/",
            "galleryEndpointUrl": "https://gallery.azure.com/",
            "managementEndpointUrl": "https://management.core.windows.net/"
          }
  data:
    - secretKey: client_id
      remoteRef:
        key: crossplane/azure
        property: AZURE_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: crossplane/azure
        property: AZURE_CLIENT_SECRET
    - secretKey: tenant_id
      remoteRef:
        key: crossplane/azure
        property: AZURE_TENANT_ID
    - secretKey: subscription_id
      remoteRef:
        key: crossplane/azure
        property: AZURE_SUBSCRIPTION_ID
