---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: monitoring-gw
  namespace: monitoring
spec:
  gatewayClassName: envoy
  listeners:
    - protocol: HTTPS
      name: https
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: monitoring-ui-cert
            namespace: monitoring
