apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitoring-tls
  namespace: monitoring
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: monitoring-ui-cert
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: monitoring
        property: monitoring-cert
    - secretKey: tls.key
      remoteRef:
        key: monitoring
        property: monitoring-key
