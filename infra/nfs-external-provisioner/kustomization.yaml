apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nfs-provisioner
resources:
  - helm-repository.yaml
  - helm-release.yaml
  - namespace.yaml

configMapGenerator:
  - name: nfs-provisioner-values
    options:
      disableNameSuffixHash: true
    files:
      - ./nfs-provisioner-values.yaml
