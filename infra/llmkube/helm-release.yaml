apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
  namespace: llmkube-system
spec:
  releaseName: llmkube
  interval: 10m
  chart:
    spec:
      chart: llmkube
      sourceRef:
        kind: HelmRepository
        name: llmkube
        namespace: llmkube-system
  values:
    modelCache:
      enabled: true
      size: 40Gi
      storageClass: local-path
