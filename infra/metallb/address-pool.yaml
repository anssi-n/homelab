apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lb-address-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.50/32
    - 192.168.1.51/32
    - 192.168.1.52/32
    - 192.168.1.53/32
    - 192.168.1.54/32
    - 192.168.1.55/32
    - 192.168.1.56/32
    - 192.168.1.57/32
    - 192.168.1.58/32
    - 192.168.1.59/32
