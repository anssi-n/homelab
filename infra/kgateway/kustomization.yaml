apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kgateway-system
resources:
  - oci-repository-crds.yaml
  - oci-repository-kgateway.yaml
  - helm-release-crds.yaml
  - helm-release-kgateway.yaml
  - namespace.yaml

configMapGenerator:
  - name: kgateway-values
    options:
      disableNameSuffixHash: true
    files:
      - ./kgateway-values.yaml
