apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway
spec:
  releaseName: envoy-gateway
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
    namespace: envoy-gateway
  valuesFrom:
    - kind: ConfigMap
      name: envoy-gateway-values
      valuesKey: envoy-gateway-values.yaml
