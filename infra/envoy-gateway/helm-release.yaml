apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway
spec:
  releaseName: envoy-gateway
  interval: 10m
  # install:
  #   crds: Skip # <--- Tell Flux NOT to try creating/modifying CRDs
  # upgrade:
  #   crds: Skip # <--- Skip CRD management during upgrades too
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
    namespace: envoy-gateway
  valuesFrom:
    - kind: ConfigMap
      name: envoy-gateway-values
      valuesKey: envoy-gateway-values.yaml
