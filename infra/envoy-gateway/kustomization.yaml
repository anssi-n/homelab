apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: envoy-gateway
resources:
  - oci-repository.yaml
  - helm-release.yaml
  - namespace.yaml
  - gatewayclass.yaml

configMapGenerator:
  - name: envoy-gateway-values
    options:
      disableNameSuffixHash: true
    files:
      - ./envoy-gateway-values.yaml
