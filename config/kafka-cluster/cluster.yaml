apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka-cluster
  namespace: kafka-cluster
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  entityOperator:
    topicOperator: {}
    userOperator: {}
  kafka:
    authorization:
      type: simple
    version: 4.2.0
    config:
      auto.create.topics.enable: true
    listeners:
      - authentication:
          type: scram-sha-512
        configuration:
          brokerCertChainAndKey:
            certificate: tls.crt
            key: tls.key
            secretName: kafka-certificate
          brokers:
            - advertisedHost: kafka-broker-10.kafka.k8s.anyman.homelab
              advertisedPort: 9092
              broker: 10
            - advertisedHost: kafka-broker-11.kafka.k8s.anyman.homelab
              advertisedPort: 9092
              broker: 11
            - advertisedHost: kafka-broker-12.kafka.k8s.anyman.homelab
              advertisedPort: 9092
              broker: 12
          createBootstrapService: true
        name: homelab
        port: 9092
        tls: true
        type: cluster-ip
