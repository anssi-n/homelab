apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: kafka-cluster-broker-10
  namespace: kafka-cluster
spec:
  hostnames:
    - kafka-broker-10.kafka.k8s.anyman.homelab
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kafka-gateway
      namespace: kafka-cluster
      sectionName: kafka-listener
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: kafka-cluster-broker-homelab-10
          port: 9092
---
