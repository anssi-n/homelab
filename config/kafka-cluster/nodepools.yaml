apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  annotations:
    strimzi.io/next-node-ids: '[10-100]'
  labels:
    strimzi.io/cluster: kafka-cluster
  name: broker
  namespace: kafka-cluster
spec:
  replicas: 3
  roles:
  - broker
  storage:
    class: longhorn
    size: 5G
    type: persistent-claim
    deleteClaim: true
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  annotations:
    strimzi.io/next-node-ids: '[0-9]'
  labels:
    strimzi.io/cluster: kafka-cluster
  name: controller
  namespace: kafka-cluster
spec:
  replicas: 1
  roles:
  - controller
  storage:
    class: longhorn
    size: 5G
    type: persistent-claim
    deleteClaim: true