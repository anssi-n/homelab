apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: kafka-user
  namespace: kafka-cluster
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations:
          - "All"
        host: "*"
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations:
          - "All"
        host: "*"
      - resource:
          type: cluster
        operations:
          - "All"
      - resource:
          type: transactionalId
          name: "*"
          patternType: literal
        operations:
          - "All"
