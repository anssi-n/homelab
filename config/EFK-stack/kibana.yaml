apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: efk
spec:
  version: 9.4.3
  count: 1
  elasticsearchRef:
    name: elastic-search

  http:
    tls:
      selfSignedCertificate:
        subjectAltNames:
          - dns: kibana.k8s.anyman.homelab

  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 1Gi
              cpu: 500m
