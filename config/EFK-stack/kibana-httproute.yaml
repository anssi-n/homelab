apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kibana-httproute
  namespace: efk
spec:
  parentRefs:
    - name: kibana-gw
      sectionName: https
      kind: Gateway

  hostnames:
    - kibana.k8s.anyman.homelab

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kibana-kb-http
          port: 5601
