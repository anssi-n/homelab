---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-gateway
  namespace: infra
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: https-mcp
      protocol: HTTPS
      port: 443
      hostname: "*.mcp.anyman.homelab"
      tls:
        mode: Terminate
        certificateRefs:
          - name: mcp-wildcard-tls-secret
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              allow-ai-gateway: "true"
