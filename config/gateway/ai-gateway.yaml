---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: ai-gateway-config
  namespace: infra
spec:
  deployment:
    spec:
      replicas: 2
      template:
        spec:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-class-name: agentgateway
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-class-name: agentgateway
          volumes:
            - name: homelab-ca
              secret:
                defaultMode: 420
                secretName: keycloak-ca-cert
                items:
                  - key: ca.crt
                    path: c3c5bfd3.0
          containers:
            - name: agentgateway
              volumeMounts:
                - name: homelab-ca
                  mountPath: /etc/homelab-ca
                  readOnly: true
  env:
    - name: SSL_CERT_DIR
      value: /etc/homelab-ca

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-gateway
  namespace: infra
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: ai-gateway-config
  listeners:
    - name: https-mcp
      protocol: HTTPS
      port: 443
      hostname: "*.mcp.anyman.homelab"
      tls:
        mode: Terminate
        certificateRefs:
          - name: mcp-wildcard-tls-secret
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              allow-ai-gateway: "true"
