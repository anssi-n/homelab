---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-wildcard-tls
  namespace: infra
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mcp-wildcard-tls-secret
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: mcp
        property: mcp-cert
    - secretKey: tls.key
      remoteRef:
        key: mcp
        property: mcp-cert-key
