apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: homelab
  namespace: cnpg-cluster
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  storage:
    storageClass: local-path
    size: 5Gi
  walStorage:
    storageClass: local-path
    size: 1Gi
  managed:
    roles:
      - name: huutoapp
        ensure: present
        login: true
        superuser: false
